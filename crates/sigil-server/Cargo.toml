[package]
name = "sigil-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OSS reference policy/event server for Sigil (POST /v1/events, GET /v1/policy)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "sigil-server"
path = "src/main.rs"

[dependencies]
sigil-core = { path = "../sigil-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true, features = ["query"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
blake3 = { workspace = true }
parking_lot = { workspace = true }
ed25519-dalek = { workspace = true }
data-encoding = { workspace = true }
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }

# -- OS packages -------------------------------------------------------------
# Build with `packaging/build.sh server`. See packaging/README.md.

[package.metadata.deb]
name = "sigil-server"
maintainer = "Sigil contributors <sigil@users.noreply.github.com>"
section = "admin"
priority = "optional"
depends = "libc6"
maintainer-scripts = "../../packaging/debian-server"
extended-description = """\
Sigil OSS reference server. Receives sigil agent posture events over HTTPS \
(mTLS when configured) and writes them to per-host JSONL. Serves signed policy bundles at \
GET /v1/policy. Ships a systemd unit (disabled by default — enable with \
`systemctl enable --now sigil-server`)."""
assets = [
    ["../../target/release/sigil-server", "usr/bin/", "755"],
    ["../../config/server.example.yaml", "etc/sigil/server.yaml.example", "644"],
    ["../../README.md", "usr/share/doc/sigil-server/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/sigil-server/LICENSE", "644"],
    # Create the sigil group/user so the unit's User=sigil resolves at start
    # (#10 slice 2). Idempotent. No tmpfiles here: systemd StateDirectory=
    # sigil-server owns /var/lib/sigil-server as sigil:sigil; the agent's
    # /var/lib/sigil is not used on a server-only host.
    ["../../packaging/sysusers.d/sigil.conf", "usr/lib/sysusers.d/sigil.conf", "644"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "../../packaging/systemd"
unit-name = "sigil-server"
enable = false
start = false

[package.metadata.generate-rpm]
name = "sigil-server"
summary = "OSS reference server: receives sigil agent events over HTTPS (mTLS when configured)"
assets = [
    { source = "../../target/release/sigil-server", dest = "/usr/bin/sigil-server", mode = "0755" },
    { source = "../../packaging/systemd/sigil-server.service", dest = "/usr/lib/systemd/system/sigil-server.service", mode = "0644" },
    { source = "../../config/server.example.yaml", dest = "/etc/sigil/server.yaml.example", mode = "0644" },
    { source = "../../README.md", dest = "/usr/share/doc/sigil-server/README.md", mode = "0644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/doc/sigil-server/LICENSE", mode = "0644", doc = true },
    { source = "../../packaging/sysusers.d/sigil.conf", dest = "/usr/lib/sysusers.d/sigil.conf", mode = "0644" },
    { source = "../../packaging/selinux/sigil.te", dest = "/usr/share/selinux/packages/sigil/sigil.te", mode = "0644" },
    { source = "../../packaging/selinux/sigil.fc", dest = "/usr/share/selinux/packages/sigil/sigil.fc", mode = "0644" },
]
# Create the sigil user/group so the unit's User=sigil resolves before start
# (#10 slice 2). Idempotent; no-op when the agent package already created it.
# Also load the SELinux module (#69) when the policy devel toolchain is present.
post_install_script = """\
systemctl daemon-reload >/dev/null 2>&1 || :
command -v systemd-sysusers >/dev/null 2>&1 && systemd-sysusers /usr/lib/sysusers.d/sigil.conf >/dev/null 2>&1 || :
if command -v semodule >/dev/null 2>&1 && [ -f /usr/share/selinux/devel/Makefile ]; then ( cd /usr/share/selinux/packages/sigil && make -f /usr/share/selinux/devel/Makefile sigil.pp >/dev/null 2>&1 && semodule -i sigil.pp >/dev/null 2>&1 ) || : ; command -v restorecon >/dev/null 2>&1 && restorecon -R /usr/bin/sigil-server /var/lib/sigil-server /var/log/sigil-server /etc/sigil >/dev/null 2>&1 || : ; fi
"""
pre_uninstall_script = """\
if [ "$1" = 0 ] ; then
    systemctl --no-reload disable --now sigil-server.service >/dev/null 2>&1 || :
fi
"""
post_uninstall_script = """\
systemctl daemon-reload >/dev/null 2>&1 || :
if [ "$1" -ge 1 ] ; then
    systemctl try-restart sigil-server.service >/dev/null 2>&1 || :
fi
"""

