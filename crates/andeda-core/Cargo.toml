[package]
name = "andeda-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Enable the commercial rule pack. Requires andeda-rules-pro to be checked
# out as a sibling of this repo (../../anti_i-rules-pro). Builds without
# this feature do not link the pro crate at all.
pro = ["dep:andeda-rules-pro"]

[dependencies]
andeda-rules-basic = { path = "../andeda-rules-basic" }
andeda-rules-pro = { path = "../../../anti_i-rules-pro/crates/andeda-rules-pro", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
globset = { workspace = true }
dunce = { workspace = true }
rusqlite = { workspace = true }
hdrhistogram = { workspace = true }
parking_lot = { workspace = true }
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand_core = { version = "0.6", features = ["std"] }
insta = { workspace = true }
proptest = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
