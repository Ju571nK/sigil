[package]
name = "andeda-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Enable the commercial rule pack. Pulled from a private GitHub repo;
# requires SSH access to Ju571nK/anti_i-rules-pro. For local development
# (avoid the network round-trip), see the [patch] section in the
# workspace Cargo.toml. Builds without this feature do not link the
# pro crate at all.
pro = ["dep:andeda-rules-pro"]

[dependencies]
andeda-rules-basic = { path = "../andeda-rules-basic" }
andeda-rules-pro = { git = "ssh://git@github.com/Ju571nK/anti_i-rules-pro.git", branch = "main", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
globset = { workspace = true }
dunce = { workspace = true }
rusqlite = { workspace = true }
hdrhistogram = { workspace = true }
parking_lot = { workspace = true }
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand_core = { version = "0.6", features = ["std"] }
insta = { workspace = true }
proptest = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
