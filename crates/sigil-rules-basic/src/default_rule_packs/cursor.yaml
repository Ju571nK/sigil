id: cursor-default
pack_version: 1
tool: cursor
scope:
  kind: user_global
watched_paths:
  - "~/.cursor/mcp.json"
rules:
  - id: remote-mcp
    on_file: "~/.cursor/mcp.json"
    format: json
    selector: "$.mcpServers.*.url"
    matcher:
      kind: exists
    emit:
      kind: mcp_server_remote
      server_name: "<selector-key>"
      url: "<selector-value>"

  - id: local-command-mcp
    on_file: "~/.cursor/mcp.json"
    format: json
    selector: "$.mcpServers.*.command"
    matcher:
      kind: exists
    emit:
      kind: mcp_server_local_command
      server_name: "<selector-key>"
      command: "<selector-value>"
