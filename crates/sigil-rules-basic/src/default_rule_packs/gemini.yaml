id: gemini-default
pack_version: 1
tool: gemini
scope:
  kind: user_global
watched_paths:
  - "~/.gemini/settings.json"
rules:
  - id: sandbox-disabled
    on_file: "~/.gemini/settings.json"
    format: json
    selector: "$.sandbox"
    matcher:
      kind: equals
      value: "false"
    emit:
      kind: sandbox_disabled

  - id: remote-mcp
    on_file: "~/.gemini/settings.json"
    format: json
    selector: "$.mcpServers.*.url"
    matcher:
      kind: exists
    emit:
      kind: mcp_server_remote
      server_name: "<selector-key>"
      url: "<selector-value>"

  - id: local-command-mcp
    on_file: "~/.gemini/settings.json"
    format: json
    selector: "$.mcpServers.*.command"
    matcher:
      kind: exists
    emit:
      kind: mcp_server_local_command
      server_name: "<selector-key>"
      command: "<selector-value>"
