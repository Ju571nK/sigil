version: 1
host_id_strategy: machine_id

targets:
  - id: claude-desktop-config-macos
    description: Claude Desktop config and MCP server definitions
    tier: critical
    platform: macos
    paths:
      - "~/Library/Application Support/Claude/claude_desktop_config.json"
      - "~/.claude.json"
    recursive: false
    follow_symlinks: false

  - id: cursor-mcp-macos
    description: Cursor IDE MCP and global storage
    tier: critical
    platform: macos
    paths:
      - "~/Library/Application Support/Cursor/User/globalStorage/*.json"
    recursive: false
    follow_symlinks: false

  - id: shadow-ai-binaries-macos
    description: Detect new LLM client app installs
    tier: standard
    platform: macos
    paths:
      - "/Applications/*.app/Contents/Info.plist"
    recursive: false
    follow_symlinks: false

  - id: ai-guard-claude-code-user-global
    description: Claude Code CLI user-global guard surface (settings + hooks)
    tier: critical
    platform: macos
    paths:
      - "~/.claude/settings.json"
      - "~/.claude/settings.local.json"
      - "~/.claude/hooks/"
    recursive: true
    follow_symlinks: false

  - id: ai-guard-codex-user-global
    description: Codex CLI user-global config
    tier: critical
    platform: macos
    paths:
      - "~/.codex/config.toml"
    recursive: false
    follow_symlinks: false

  - id: ai-guard-continue-config-macos
    description: Continue.dev user-global config (VSCode/JetBrains extension)
    tier: critical
    platform: macos
    paths:
      - "~/.continue/config.json"
    recursive: false
    follow_symlinks: false

