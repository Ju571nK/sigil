version: 1
host_id_strategy: machine_id

targets:
  - id: claude-desktop-config-windows
    description: Claude Desktop config and MCP server definitions
    tier: critical
    platform: windows
    paths:
      - "%APPDATA%\\Claude\\claude_desktop_config.json"
      - "%USERPROFILE%\\.claude.json"
    recursive: false
    follow_symlinks: false

  - id: cursor-mcp-windows
    description: Cursor IDE MCP and global storage
    tier: critical
    platform: windows
    paths:
      - "%APPDATA%\\Cursor\\User\\globalStorage\\*.json"
    recursive: false
    follow_symlinks: false

  - id: shadow-ai-binaries-windows
    description: Detect new LLM client installs
    tier: standard
    platform: windows
    paths:
      - "%PROGRAMFILES%\\*\\uninstall.exe"
      - "%LOCALAPPDATA%\\Programs\\*\\*.exe"
    recursive: false
    follow_symlinks: false

  - id: ai-guard-claude-code-user-global-windows
    description: Claude Code CLI user-global guard surface (settings + hooks)
    tier: critical
    platform: windows
    paths:
      - "%USERPROFILE%\\.claude\\settings.json"
      - "%USERPROFILE%\\.claude\\settings.local.json"
      - "%USERPROFILE%\\.claude\\hooks\\"
    recursive: true
    follow_symlinks: false

  - id: ai-guard-codex-user-global-windows
    description: Codex CLI user-global config
    tier: critical
    platform: windows
    paths:
      - "%USERPROFILE%\\.codex\\config.toml"
    recursive: false
    follow_symlinks: false
