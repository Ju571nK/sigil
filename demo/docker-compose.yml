# Sigil end-to-end demo.
#
# A file change under ./watched flows:
#   sigil (agent)  ->  JSONL spool  ->  sigil-sender  --mTLS-->  sigil-server
# and the operator-signed policy flows back the other way:
#   sigil-server  -->  sigil-sender  -->  sigil   (verified via the 5-check chain, then applied)
#
# See demo/README.md.

name: sigil-demo

# All services run the same image. Only `init` declares `build:` — if every
# service did, `docker compose build` would build them in parallel and race on
# the shared `sigil-demo:latest` tag ("image already exists"). `init` runs
# first (others `depends_on` it), so the image is in place before they start.
x-sigil-image: &sigil-image
  image: sigil-demo:latest

services:
  # One-shot: build the image, generate the demo PKI + signing key, sign the
  # policy, write the config files. Owns `build:` for the whole stack.
  init:
    <<: *sigil-image
    build:
      context: ..
      dockerfile: demo/Dockerfile
    command: ["init.sh"]
    restart: "no"
    volumes:
      - ./policy.demo.yaml:/seed/policy.yaml:ro
      - etc-sigil:/etc/sigil
      - server-config:/etc/sigil-server

  sigil-server:
    <<: *sigil-image
    command: ["sigil-server", "serve", "--config", "/etc/sigil-server/server.yaml"]
    environment:
      RUST_LOG: "sigil_server=info"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - server-config:/etc/sigil-server
      - server-events:/var/lib/sigil-server/events
    ports:
      # Optional: reach the API from the host. It's mTLS, so curl needs the client cert:
      #   curl --cacert <vol>/ca.crt --cert <vol>/client.crt --key <vol>/client.key \
      #        "https://localhost:8443/v1/policy?host_id=$(docker compose exec -T sigil-server ls /var/lib/sigil-server/events)"
      - "8443:8443"

  sigil:
    <<: *sigil-image
    # --poll: use a polling watcher. Docker Desktop / Rancher Desktop run the
    # engine in a VM and don't deliver inotify events for changes inside
    # container mounts; polling stat()s the files and works everywhere.
    command: ["sigil", "run", "--poll", "--policy", "/etc/sigil/policy.yaml", "--state-db", "/var/lib/sigil/state.db", "--events-dir", "/var/log/sigil"]
    environment:
      SIGIL_LOG: "info"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./watched:/watched              # edit files here to trigger events
      - etc-sigil:/etc/sigil
      - var-lib-sigil:/var/lib/sigil
      - var-log-sigil:/var/log/sigil
      - var-run-sigil:/var/run/sigil

  sigil-sender:
    <<: *sigil-image
    command: ["sender-entrypoint.sh"]
    environment:
      RUST_LOG: "sigil_sender=info"
    depends_on:
      init:
        condition: service_completed_successfully
      sigil-server:
        condition: service_started
      sigil:
        condition: service_started
    volumes:
      - etc-sigil:/etc/sigil
      - var-lib-sigil:/var/lib/sigil
      - var-log-sigil:/var/log/sigil
      - var-run-sigil:/var/run/sigil

volumes:
  etc-sigil:
  server-config:
  server-events:
  var-lib-sigil:
  var-log-sigil:
  var-run-sigil:
