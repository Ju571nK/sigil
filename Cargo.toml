[workspace]
members = ["crates/sigil-core", "crates/sigil-agent", "crates/sigil-spool", "crates/sigil-rules-basic", "crates/sigil-sender", "crates/sigil-signer", "crates/sigil-server", "crates/sigil-mcp", "crates/sigil-hook"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Sigil contributors"]
repository = "https://github.com/Ju571nK/sigil"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde-well-known", "macros", "formatting"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
blake3 = "1"
globset = "0.4"
regex = "1"
dunce = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
hdrhistogram = "7"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
toml = "0.8"
insta = { version = "1", features = ["yaml", "json"] }
proptest = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
data-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
http = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower = "0.5"
urlencoding = "2"
rmcp = { version = "0.16", features = ["server", "transport-io"] }
httpmock = "0.7"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
