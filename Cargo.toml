[workspace]
members = ["crates/andeda-core", "crates/andeda-agent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["ANDEDA contributors"]
repository = "https://github.com/Ju571nK/andeda"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde-well-known", "macros", "formatting"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
globset = "0.4"
dunce = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
hdrhistogram = "7"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net", "process"] }
notify = { version = "6", default-features = false, features = ["macos_fsevents"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
insta = { version = "1", features = ["yaml", "json"] }
proptest = "1"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
