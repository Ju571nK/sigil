# T-01 throwaway probe (2026-10-10). Standalone: NOT a member of the sigil workspace.
[package]
name = "rmcp-sdk-probe"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.88"

[workspace]

[dependencies]
rmcp = { version = "=0.16.0", default-features = false, features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = "1"
serde_json = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "http1"] }
