name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace

  # RHEL-family validation. GitHub has no hosted Rocky runner, so run inside
  # the rockylinux:9 container — this exercises the RHEL build path (glibc
  # 2.34, dnf-installed toolchain) that the ubuntu-22.04 leg above does not.
  rocky9:
    name: rockylinux:9 / stable
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: install build deps
        run: dnf -y install git gcc perl
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocky9
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: build .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          packaging/build.sh rpm
      - name: inspect & install-test .rpm
        run: |
          set -eux
          rpm=$(echo target/generate-rpm/*.rpm)
          rpm -qpi "$rpm"
          rpm -qpl "$rpm"
          rpm -qp --scripts "$rpm"
          rpm -qpl "$rpm" | grep -qx /usr/bin/sigil
          rpm -qpl "$rpm" | grep -qx /usr/lib/systemd/system/sigil.service
          # Install for real, run the binary, then remove. (`systemctl` calls in
          # the scriptlets are `|| :`-guarded, so they're harmless in a container.)
          rpm -i "$rpm"
          /usr/bin/sigil version
          test -f /etc/sigil/policy.yaml.example
          test -f /usr/lib/systemd/system/sigil.service
          rpm -e sigil
          test ! -e /usr/bin/sigil
