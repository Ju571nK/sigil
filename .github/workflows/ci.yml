name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: hardened build (sigil-agent, --no-default-features)
        run: cargo build -p sigil-agent --no-default-features

  # RHEL-family validation. GitHub has no hosted Rocky runner, so run inside
  # the rockylinux:9 container — this exercises the RHEL build path (glibc
  # 2.34, dnf-installed toolchain) that the ubuntu-22.04 leg above does not.
  rocky9:
    name: rockylinux:9 / stable
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: install build deps
        run: dnf -y install git gcc perl
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocky9
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: hardened build (sigil-agent, --no-default-features)
        run: cargo build -p sigil-agent --no-default-features
      - name: build .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          packaging/build.sh rpm
      - name: inspect & install-test .rpm (all 4 packages)
        run: |
          set -eux
          
          while IFS='|' read -r pkg bin unit example; do
            rpm=$(echo target/generate-rpm/${pkg}-*.rpm)
            echo "=== inspecting $rpm ==="
            rpm -qpi "$rpm"
            rpm -qpl "$rpm"
            rpm -qp --scripts "$rpm"
            rpm -qpl "$rpm" | grep -qx "/usr/bin/${bin}"
            if [ -n "$unit" ]; then
              rpm -qpl "$rpm" | grep -qx "/usr/lib/systemd/system/${unit}"
            fi
            if [ -n "$example" ]; then
              rpm -qpl "$rpm" | grep -qx "$example"
            fi
            echo "=== installing $rpm ==="
            rpm -i "$rpm"
            "/usr/bin/${bin}" --help >/dev/null
            if [ -n "$unit" ]; then
              test -f "/usr/lib/systemd/system/${unit}"
            fi
            if [ -n "$example" ]; then
              test -f "$example"
            fi
            echo "=== removing $pkg ==="
            rpm -e "$pkg"
            test ! -e "/usr/bin/${bin}"
          done <<-'TABLE'
          	sigil|sigil|sigil.service|/etc/sigil/policy.yaml.example
          	sigil-sender|sigil-sender|sigil-sender.service|/etc/sigil/sender.yaml.example
          	sigil-server|sigil-server|sigil-server.service|/etc/sigil/server.yaml.example
          	sigil-signer|sigil-sign||
          	TABLE
