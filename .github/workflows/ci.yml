name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: hardened build (sigil-agent, --no-default-features)
        run: cargo build -p sigil-agent --no-default-features

  # RHEL-family validation. GitHub has no hosted Rocky runner, so run inside
  # the rockylinux:9 container — this exercises the RHEL build path (glibc
  # 2.34, dnf-installed toolchain) that the ubuntu-22.04 leg above does not.
  rocky9:
    name: rockylinux:9 / stable
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: install build deps
        run: dnf -y install git gcc perl
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocky9
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: hardened build (sigil-agent, --no-default-features)
        run: cargo build -p sigil-agent --no-default-features
      - name: build .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          packaging/build.sh rpm
      - name: inspect & install-test .rpm (all 4 packages)
        run: |
          set -eux
          
          while IFS='|' read -r pkg bin unit example; do
            # Anchor on a digit after the dash so `sigil-*.rpm` doesn't match
            # sigil-sender / sigil-server / sigil-signer too (issue #7).
            rpm=$(echo target/generate-rpm/${pkg}-[0-9]*.rpm)
            echo "=== inspecting $rpm ==="
            rpm -qpi "$rpm"
            rpm -qpl "$rpm"
            rpm -qp --scripts "$rpm"
            rpm -qpl "$rpm" | grep -qx "/usr/bin/${bin}"
            if [ -n "$unit" ]; then
              rpm -qpl "$rpm" | grep -qx "/usr/lib/systemd/system/${unit}"
            fi
            if [ -n "$example" ]; then
              rpm -qpl "$rpm" | grep -qx "$example"
            fi
            echo "=== installing $rpm ==="
            rpm -i "$rpm"
            "/usr/bin/${bin}" --help >/dev/null
            if [ -n "$unit" ]; then
              test -f "/usr/lib/systemd/system/${unit}"
            fi
            if [ -n "$example" ]; then
              test -f "$example"
            fi
            echo "=== removing $pkg ==="
            rpm -e "$pkg"
            test ! -e "/usr/bin/${bin}"
          done <<-'TABLE'
          	sigil|sigil|sigil.service|/etc/sigil/policy.yaml.example
          	sigil-sender|sigil-sender|sigil-sender.service|/etc/sigil/sender.yaml.example
          	sigil-server|sigil-server|sigil-server.service|/etc/sigil/server.yaml.example
          	sigil-signer|sigil-sign||
          	TABLE

  # Debian/Ubuntu validation of the .deb packages. The rocky9 leg covers the
  # RPM path; this covers .deb end-to-end: build all four, install each, smoke
  # `--help`, then purge and verify cleanup. (#11)
  debian12:
    name: debian:12 / .deb install-test
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: install build deps
        run: |
          apt-get update
          apt-get install -y git gcc perl ca-certificates curl init-system-helpers
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian12
      - name: build .deb (all 4 packages)
        run: |
          cargo install cargo-deb --locked
          packaging/build.sh deb
      - name: inspect & install-test .deb (all 4 packages)
        shell: bash
        run: |
          set -eux
          for entry in \
            "sigil|sigil|sigil.service|/etc/sigil/policy.yaml.example" \
            "sigil-sender|sigil-sender|sigil-sender.service|/etc/sigil/sender.yaml.example" \
            "sigil-server|sigil-server|sigil-server.service|/etc/sigil/server.yaml.example" \
            "sigil-signer|sigil-sign||"; do
            IFS='|' read -r pkg bin unit example <<< "$entry"
            # the `_` after the name keeps sigil_ from matching sigil-sender_ etc.
            deb=$(echo target/debian/${pkg}_[0-9]*.deb)
            echo "=== $pkg :: $deb ==="
            dpkg --info "$deb"
            # Capture once; grep via here-string. A `dpkg --contents | grep -q`
            # pipe SIGPIPEs dpkg's tar subprocess (grep exits at first match),
            # which fails the step under bash's default `set -o pipefail`.
            contents=$(dpkg --contents "$deb")
            printf '%s\n' "$contents"
            grep -qE "/usr/bin/${bin}$" <<< "$contents"
            [ -z "$unit" ]    || grep -qE "/systemd/system/${unit}$" <<< "$contents"
            [ -z "$example" ] || grep -qE "${example}$" <<< "$contents"
            dpkg -i "$deb"
            "/usr/bin/${bin}" --help >/dev/null
            [ -z "$example" ] || test -f "$example"
            dpkg -P "$pkg"
            test ! -e "/usr/bin/${bin}"
          done
