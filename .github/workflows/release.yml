name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds prebuilt binaries for each target (x86_64 + aarch64), publishes
# them to a GitHub Release with a SHA256SUMS file, attaches build-provenance
# attestations, and — when the SIGIL_BUILD_SIGNING_KEY secret is set — an
# ed25519-signed build manifest (per-arch blake3) that `sigil doctor
# --verify-self` checks against the compiled-in SIGIL_BUILD_PUBKEYS (#13).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release + upload assets
  id-token: write       # OIDC token for build provenance
  attestations: write   # actions/attest-build-provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl   # static — runs on any Linux (incl. RHEL/Rocky)
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl  # static ARM64 — Graviton, Ampere, Pi 4+ (#12)
            os: ubuntu-22.04-arm                 # GitHub-hosted ARM64 Linux runner
          - target: aarch64-apple-darwin        # Apple Silicon only (Intel Macs not supported)
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc     # Arm Windows (Surface Pro X, Arm laptops)
            os: windows-11-arm                   # GitHub-hosted ARM64 runner
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: ${{ endsWith(matrix.target, '-linux-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          dist="sigil-${ver}-${{ matrix.target }}"
          mkdir "$dist"
          for b in sigil sigil-sender sigil-server sigil-sign sigil-mcp sigil-hook; do
            cp "target/${{ matrix.target }}/release/$b" "$dist/"
          done
          cp README.md LICENSE NOTICE "$dist/" 2>/dev/null || true
          tar -czf "${dist}.tar.gz" "$dist"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $dist = "sigil-$ver-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dist | Out-Null
          foreach ($b in 'sigil','sigil-sender','sigil-server','sigil-sign','sigil-mcp','sigil-hook') {
            Copy-Item "target/${{ matrix.target }}/release/$b.exe" $dist
          }
          Copy-Item README.md,LICENSE,NOTICE $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            sigil-*.tar.gz
            sigil-*.zip
          if-no-files-found: error

  packages:
    name: linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64                         # #12
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools + packagers
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install cargo-deb cargo-generate-rpm

      # Static (musl) binaries so the .rpm/.deb run on any glibc — incl. RHEL/Rocky 9.
      # build.sh cross-builds into target/<triple>/release, stages into
      # target/release, and stamps the package arch (deb via --target, rpm via --arch).
      - name: Build all packages (.deb + .rpm)
        run: packaging/build.sh all --target ${{ matrix.target }}

      - name: Collect packages into a flat dir
        run: |
          mkdir -p pkgs
          cp target/${{ matrix.target }}/debian/*.deb pkgs/
          cp target/generate-rpm/*.rpm pkgs/
          ls -l pkgs/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: pkgs/*
          if-no-files-found: error

  manifest:
    name: sign complete build manifest
    needs: build
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      SIGNING_KEY: ${{ secrets.SIGIL_BUILD_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-*-*'
          merge-multiple: true
      - name: Sign build manifest
        id: sign
        if: ${{ env.SIGNING_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          python3 packaging/release_manifest.py sign \
            --dist dist --version "${GITHUB_REF_NAME#v}" --key "$key" \
            --git-sha "$GITHUB_SHA" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signed == 'true'
        with:
          name: build-manifest
          path: dist/build-manifest.json
          if-no-files-found: error

  verify:
    name: verify signed release ${{ matrix.target }}
    needs: manifest
    if: needs.manifest.outputs.signed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: build-manifest
          path: dist
      - name: Verify native binary and reject tampered signature
        shell: bash
        run: |
          python3 packaging/release_manifest.py verify \
            --dist dist --version "${GITHUB_REF_NAME#v}" \
            --target "${{ matrix.target }}" --git-sha "$GITHUB_SHA"

  release:
    name: publish release
    needs: [build, packages, manifest, verify]
    # Unsigned repositories remain supported, but signed builds cannot bypass verification.
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success' &&
          needs.packages.result == 'success' && needs.manifest.result == 'success' &&
          ((needs.manifest.outputs.signed == 'true' && needs.verify.result == 'success') ||
           (needs.manifest.outputs.signed != 'true' && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        # Include the agent .deb, whose filename begins with sigil_ (#138).
        run: sha256sum sigil* | tee SHA256SUMS

      # Supplementary supply-chain attestation. The enforced trust root is the
      # ed25519 build-manifest signature produced in the build step above; this
      # GitHub/Sigstore provenance is a best-effort extra. A transient Sigstore
      # Rekor outage (network timeout fetching a tlog entry) must NOT block
      # publishing already-built, already-signed artifacts — so this step is
      # non-blocking. On an outage, re-run the job to (re-)attach attestations. (#130)
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          # `sigil*` so the agent .deb (`sigil_<ver>-1_<arch>.deb`, underscore)
          # is attested too — `sigil-*` would skip it. (#138)
          subject-path: "dist/sigil*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          ## Install (macOS / Linux)

          ```sh
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/Ju571nK/sigil/main/install.sh | sh
          ```

          Pin a version with `SIGIL_VERSION`, or install elsewhere with `SIGIL_INSTALL_DIR`.

          ## Verify a download

          ```sh
          sha256sum -c SHA256SUMS                              # integrity
          gh attestation verify <archive> --repo Ju571nK/sigil # provenance
          ```

          If `build-manifest.json` is attached, an installed agent can verify itself
          against it:

          ```sh
          sigil doctor --verify-self --manifest build-manifest.json
          ```

          ## Windows

          Download the `.zip` for your architecture (`x86_64` for most PCs,
          `aarch64` for Arm devices such as Surface Pro X) and add it to your PATH.

          Every archive contains all six binaries: `sigil`, `sigil-sender`, `sigil-server`, `sigil-sign`, `sigil-mcp`, `sigil-hook`.

          `sigil-mcp` is the read-only fleet MCP server — point an MCP client (Claude Desktop/Code) at a `sigil-server`'s read API to query and reason over fleet posture. See [crates/sigil-mcp/README.md](https://github.com/Ju571nK/sigil/blob/main/crates/sigil-mcp/README.md).

          ## Server + agent (Linux, x86_64 and aarch64)

          Prebuilt `.deb` / `.rpm` packages (static binaries — work on RHEL/Rocky and
          Debian/Ubuntu, on both x86_64 and ARM64). See [docs/install-server.md](https://github.com/Ju571nK/sigil/blob/main/docs/install-server.md).

          ```sh
          sudo dnf install ./sigil-server-*.x86_64.rpm     # RHEL / Rocky / Fedora (x86_64)
          sudo dnf install ./sigil-server-*.aarch64.rpm    # … ARM64
          sudo apt  install ./sigil-server_*_amd64.deb     # Debian / Ubuntu (x86_64)
          sudo apt  install ./sigil-server_*_arm64.deb     # … ARM64
          ```

          Each package ships a hardened, disabled-by-default systemd unit + config example.
          (`armv7` is supported by `packaging/build.sh --target armv7-unknown-linux-gnueabihf`
          but is not built in CI.)
          EOF
          # Tags with a pre-release suffix (e.g. v0.1.0-rc.1) are marked
          # --prerelease so they don't become "latest" — install.sh won't pick
          # them up, which makes them safe for dry-runs.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # build-manifest.json is only present when the signing secret is set.
          manifest=""
          [ -f dist/build-manifest.json ] && manifest="dist/build-manifest.json"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            $prerelease \
            --notes-file notes.md \
            dist/sigil* dist/SHA256SUMS $manifest
