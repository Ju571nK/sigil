name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds prebuilt binaries for each target, publishes them to a GitHub
# Release with a SHA256SUMS file, and attaches build-provenance attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release + upload assets
  id-token: write       # OIDC token for build provenance
  attestations: write   # actions/attest-build-provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl   # static — runs on any Linux (incl. RHEL/Rocky)
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          dist="sigil-${ver}-${{ matrix.target }}"
          mkdir "$dist"
          for b in sigil sigil-sender sigil-server sigil-sign; do
            cp "target/${{ matrix.target }}/release/$b" "$dist/"
          done
          cp README.md LICENSE NOTICE "$dist/" 2>/dev/null || true
          tar -czf "${dist}.tar.gz" "$dist"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $dist = "sigil-$ver-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dist | Out-Null
          foreach ($b in 'sigil','sigil-sender','sigil-server','sigil-sign') {
            Copy-Item "target/${{ matrix.target }}/release/$b.exe" $dist
          }
          Copy-Item README.md,LICENSE,NOTICE $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            sigil-*.tar.gz
            sigil-*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum sigil-* | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/sigil-*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install (macOS / Linux)

          ```sh
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/Ju571nK/sigil/main/install.sh | sh
          ```

          Pin a version with `SIGIL_VERSION`, or install elsewhere with `SIGIL_INSTALL_DIR`.

          ## Verify a download

          ```sh
          sha256sum -c SHA256SUMS                              # integrity
          gh attestation verify <archive> --repo Ju571nK/sigil # provenance
          ```

          ## Windows

          Download the `.zip` below and add it to your PATH.

          Every archive contains all four binaries: `sigil`, `sigil-sender`, `sigil-server`, `sigil-sign`.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file notes.md \
            dist/sigil-* dist/SHA256SUMS
