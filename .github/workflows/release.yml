name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds prebuilt binaries for each target, publishes them to a GitHub
# Release with a SHA256SUMS file, and attaches build-provenance attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release + upload assets
  id-token: write       # OIDC token for build provenance
  attestations: write   # actions/attest-build-provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl   # static — runs on any Linux (incl. RHEL/Rocky)
            os: ubuntu-22.04
          - target: aarch64-apple-darwin        # Apple Silicon only (Intel Macs not supported)
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc     # Arm Windows (Surface Pro X, Arm laptops)
            os: windows-11-arm                   # GitHub-hosted ARM64 runner
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          dist="sigil-${ver}-${{ matrix.target }}"
          mkdir "$dist"
          for b in sigil sigil-sender sigil-server sigil-sign; do
            cp "target/${{ matrix.target }}/release/$b" "$dist/"
          done
          cp README.md LICENSE NOTICE "$dist/" 2>/dev/null || true
          tar -czf "${dist}.tar.gz" "$dist"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $dist = "sigil-$ver-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dist | Out-Null
          foreach ($b in 'sigil','sigil-sender','sigil-server','sigil-sign') {
            Copy-Item "target/${{ matrix.target }}/release/$b.exe" $dist
          }
          Copy-Item README.md,LICENSE,NOTICE $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            sigil-*.tar.gz
            sigil-*.zip
          if-no-files-found: error

  packages:
    name: linux packages (server, static)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools + packagers
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install cargo-deb cargo-generate-rpm

      # Static (musl) binary so the .rpm/.deb run on any glibc — incl. RHEL/Rocky 9.
      - name: Build static sigil-server
        run: cargo build --release --locked -p sigil-server --target x86_64-unknown-linux-musl

      - name: Stage binary where the packagers expect it
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/sigil-server target/release/sigil-server

      - name: Build .deb + .rpm
        working-directory: crates/sigil-server
        run: |
          mkdir -p ../../target/generate-rpm
          cargo deb --no-build
          cargo generate-rpm --output ../../target/generate-rpm/

      # Flatten into one dir so the artifact (and dist/) has the packages at the
      # root — the release job globs dist/sigil-* non-recursively.
      - name: Collect packages into a flat dir
        run: |
          mkdir -p pkgs
          cp target/debian/*.deb target/generate-rpm/*.rpm pkgs/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: pkgs/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum sigil-* | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/sigil-*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install (macOS / Linux)

          ```sh
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/Ju571nK/sigil/main/install.sh | sh
          ```

          Pin a version with `SIGIL_VERSION`, or install elsewhere with `SIGIL_INSTALL_DIR`.

          ## Verify a download

          ```sh
          sha256sum -c SHA256SUMS                              # integrity
          gh attestation verify <archive> --repo Ju571nK/sigil # provenance
          ```

          ## Windows

          Download the `.zip` for your architecture (`x86_64` for most PCs,
          `aarch64` for Arm devices such as Surface Pro X) and add it to your PATH.

          Every archive contains all four binaries: `sigil`, `sigil-sender`, `sigil-server`, `sigil-sign`.

          ## Server (Linux)

          Run the collector from a prebuilt package (static binary — works on RHEL/Rocky and Debian/Ubuntu). See [docs/install-server.md](https://github.com/Ju571nK/sigil/blob/main/docs/install-server.md).

          ```sh
          sudo dnf install ./sigil-server-*.x86_64.rpm     # RHEL / Rocky / Fedora
          sudo apt  install ./sigil-server_*_amd64.deb     # Debian / Ubuntu
          ```

          Each package ships a hardened, disabled-by-default systemd unit + config example.
          EOF
          # Tags with a pre-release suffix (e.g. v0.1.0-rc.1) are marked
          # --prerelease so they don't become "latest" — install.sh won't pick
          # them up, which makes them safe for dry-runs.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            $prerelease \
            --notes-file notes.md \
            dist/sigil-* dist/SHA256SUMS
